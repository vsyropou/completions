services:
  postgres:
    image: postgres:18
    container_name: telemetry-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: complete
      POSTGRES_PASSWORD: complete
      POSTGRES_DB: telemetry
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - telemetry-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complete"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  telemetry-net:
    driver: bridge
