[package]
name = "sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["io-std", "io-util", "sync", "rt-multi-thread", "macros", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-elixir = "0.3"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.6"
ignore = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["net"] }

# Shrink the shipped binary that rides inside the .vsix.
[profile.release]
strip = true            # remove symbol tables (Rust 1.77+ ships strip here)
lto = true              # whole-program optimization; biggest single win
codegen-units = 1       # feed the linker one TU for max cross-inlining
panic = "abort"         # drop the unwinding runtime
opt-level = "z"         # favor code size over speed
